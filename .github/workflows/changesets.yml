name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Maintain release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update release PR
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
          version-script: npm run changeset:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: false
