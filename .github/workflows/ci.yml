name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-quality:
    name: Windows quality
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun ci

      - name: Run quality gate
        run: bun run check

      - name: Validate pull request title and commits
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
            $env:PR_TITLE | bunx --bun --no-install commitlint --verbose
          }
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            bunx --bun --no-install commitlint --from $env:BASE_SHA --to $env:HEAD_SHA --verbose
          }

      - name: Validate pull request Changeset
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          bun .ci/quality/assert-pr-changeset.ts $env:BASE_SHA $env:HEAD_SHA $env:HEAD_REF $env:PR_AUTHOR
          if ($env:HEAD_REF -ne "changeset-release/main" -and $env:PR_AUTHOR -ne "dependabot[bot]") {
            bunx --bun --no-install changeset status --since $env:BASE_SHA
          }

      - name: Check committed whitespace errors
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            git diff --check "$env:BASE_SHA...$env:HEAD_SHA"
          } else {
            git show --check --format=fuller $env:HEAD_SHA
          }
