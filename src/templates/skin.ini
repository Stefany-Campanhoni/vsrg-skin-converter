[General]
    Name: ${skin_name}
    Author: tefyy converter
    Version: latest
    CursorCentre: 0
    CursorExpand: 1
    CursorRotate: 0

[Fonts]
    ScorePrefix: score
    ScoreOverlap: 0

    ComboPrefix: score
    ComboOverlap: 0

[Mania]
    Keys: 4
    BarlineHeight: 0
    WarningArrow: _blank

    ColumnLineWidth: 0,0,0,0,0
    ColumnStart: 280
    ColumnWidth: ${column_width},${column_width},${column_width},${column_width}

    Colour1: 0,0,0,230
    Colour2: 0,0,0,230
    Colour3: 0,0,0,230
    Colour4: 0,0,0,230
    ColourHold: 255,255,255,255

    ComboPosition: ${combo_position}
    HitPosition: ${hit_position}
    ScorePosition: ${score_position}

    JudgementLine: 1
    KeysUnderNotes: 1

    LightingL: _blank
    LightingN: _blank

    NoteImage0: mania\notes\left
    NoteImage0H: mania\notes\left
    NoteImage0L: mania\lns\body
    NoteImage0T: mania\lns\tail

    NoteImage1: mania\notes\down
    NoteImage1H: mania\notes\down
    NoteImage1L: mania\lns\body
    NoteImage1T: mania\lns\tail

    NoteImage2: mania\notes\up
    NoteImage2H: mania\notes\up
    NoteImage2L: mania\lns\body
    NoteImage2T: mania\lns\tail

    NoteImage3: mania\notes\right
    NoteImage3H: mania\notes\right
    NoteImage3L: mania\lns\body
    NoteImage3T: mania\lns\tail

    StageHint: _blank
    StageLight: _blank
    StageLeft: _blank
    StageRight: _blank

    KeyImage0: mania\receptors\left@2x
    KeyImage0D: mania\receptors\left_tap@2x
    KeyImage1: mania\receptors\down@2x
    KeyImage1D: mania\receptors\down_tap@2x
    KeyImage2: mania\receptors\up@2x
    KeyImage2D: mania\receptors\up_tap@2x
    KeyImage3: mania\receptors\right@2x
    KeyImage3D: mania\receptors\right_tap@2x

    Hit0: mania\judgements\miss
    Hit50: mania\judgements\bad
    Hit100: mania\judgements\good
    Hit200: mania\judgements\great
    Hit300: mania\judgements\perfect
    Hit300g: mania\judgements\marvelous
